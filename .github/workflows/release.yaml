name: Release APK

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: echo '${{ secrets.DART_DEFINES }}' > dart_defines.json
      - run: flutter build apk --release --dart-define-from-file=dart_defines.json --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}
      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk